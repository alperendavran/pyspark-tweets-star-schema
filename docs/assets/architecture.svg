<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Star schema pipeline architecture">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="920" height="340" rx="16" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">PySpark Star Schema on Databricks</text>
  <text x="460" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">38M+ Ukraine tweet CSVs ’ Delta Lake ’ broadcast join metrics</text>

  <g filter="url(#shadow)">
    <rect x="40" y="95" width="150" height="70" rx="10" fill="#0369a1"/>
    <text x="115" y="125" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="600">CSV Volume</text>
    <text x="115" y="145" text-anchor="middle" fill="#e0f2fe" font-family="system-ui" font-size="11">UC Volumes</text>
  </g>
  <path d="M190 130 H235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="240" y="95" width="150" height="70" rx="10" fill="#7c3aed"/>
    <text x="315" y="125" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="600">Fact Table</text>
    <text x="315" y="145" text-anchor="middle" fill="#ede9fe" font-family="system-ui" font-size="11">partitioned by tweet_date</text>
  </g>
  <path d="M390 130 H435" stroke="#a78bfa" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="440" y="95" width="150" height="70" rx="10" fill="#059669"/>
    <text x="515" y="125" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="600">User Dim</text>
    <text x="515" y="145" text-anchor="middle" fill="#d1fae5" font-family="system-ui" font-size="11">volume_rank, tiers</text>
  </g>
  <path d="M515 165 V205" stroke="#34d399" stroke-width="2"/>
  <path d="M315 165 V205 H515" stroke="#34d399" stroke-width="2" fill="none"/>
  <g filter="url(#shadow)">
    <rect x="240" y="210" width="180" height="70" rx="10" fill="#ea580c"/>
    <text x="330" y="240" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="600">Broadcast Join</text>
    <text x="330" y="260" text-anchor="middle" fill="#ffedd5" font-family="system-ui" font-size="11">dim ’ every executor</text>
  </g>
  <path d="M420 245 H470" stroke="#fb923c" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="475" y="210" width="180" height="70" rx="10" fill="#dc2626"/>
    <text x="565" y="235" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="600">Platform KPIs</text>
    <text x="565" y="255" text-anchor="middle" fill="#fee2e2" font-family="system-ui" font-size="11">concentration metrics</text>
  </g>
  <path d="M655 245 H700" stroke="#f87171" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="705" y="210" width="175" height="70" rx="10" fill="#ca8a04"/>
    <text x="792" y="235" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="14" font-weight="600">Content Stats</text>
    <text x="792" y="255" text-anchor="middle" fill="#fef9c3" font-family="system-ui" font-size="11">language, hashtags</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
