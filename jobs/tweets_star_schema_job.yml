# Databricks Job definition (import via Jobs UI or Databricks Asset Bundle)
resources:
  jobs:
    tweets_star_schema:
      name: tweets-star-schema-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/tweets_star_schema_pipeline
            base_parameters:
              TARGET_SCHEMA: bootcamp_students.alperendavran
              TWEETS_PATH: /Volumes/tabular/dataexpert/tweets/*.csv
              WRITE_MODE: overwrite
              BIG_ACCOUNT_FOLLOWERS: "100000"
              TOP_N_TWEETERS: "10"
              FORCE_EXPLICIT_BROADCAST: "0"
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: m4.xlarge
            num_workers: 2
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
